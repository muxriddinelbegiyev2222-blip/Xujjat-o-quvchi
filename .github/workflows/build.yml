name: Build Windows EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Kodlarni yuklash
      uses: actions/checkout@v4

    - name: Python sozlash
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Kutubxonalarni o'rnatish
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: EXE yasash
      run: |
        pyinstaller --noconfirm --onedir --windowed --name "HujjatSaralovchi" app.py

    - name: Tayyor faylni saqlash
      uses: actions/upload-artifact@v4
      with:
        name: HujjatSaralovchi-EXE
        path: dist/HujjatSaralovchi/
